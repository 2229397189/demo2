server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
      force-request: true

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: agi-assistant

  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agi_assistant}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: ${DB_MIN_IDLE:1}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000
      pool-name: AgiAssistantHikariPool
      initialization-fail-timeout: 0

  # Auto-run SQL init on first startup
  sql:
    init:
      mode: always
      schema-locations: file:sql/init.sql
      continue-on-error: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1
        shutdown-timeout: 100ms

  # Kafka
  # 审计日志异步通道。KafkaConfig 由该开关控制是否装配；
  # 关闭时 AuditService 自动降级为本地日志，不影响业务。
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
    consumer:
      group-id: agi-assistant-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      missing-topics-fatal: false

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Servlet
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.agi.assistant.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix:
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ──────────────────────────────────────────────────────────────
#  RAG 基础设施建设
#  RagInitializer 依赖此开关创建 Milvus collection 与 ES index mapping。
#  之前该键缺失导致初始化器从未装配 → 向量库/索引从未创建（已修复）。
# ──────────────────────────────────────────────────────────────
rag:
  initializer:
    enabled: ${RAG_INITIALIZER_ENABLED:true}
  # ES 索引分词器：装了 analysis-ik 插件后可改成 ik_max_word / ik_smart
  # 注意：分词器写在字段 mapping 里，已存在的索引需要删除重建才会生效
  analyzer:
    index: ${ES_INDEX_ANALYZER:standard}
    search: ${ES_SEARCH_ANALYZER:standard}
  # 文档入库时的知识图谱构建（实体抽取 -> Entity/DocumentChunk 节点 -> MENTIONS 边）
  # 每篇文档会按 max-chunks 的规模触发若干次 LLM 抽取调用，成本敏感时可关闭
  graph-extraction:
    enabled: ${RAG_GRAPH_EXTRACTION_ENABLED:true}
    max-chunks: ${RAG_GRAPH_EXTRACTION_MAX_CHUNKS:40}

# Milvus
milvus:
  enabled: ${MILVUS_ENABLED:false}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  database: ${MILVUS_DATABASE:default}
  collection-prefix: agi_

# Elasticsearch
spring.elasticsearch:
  uris: ${ELASTICSEARCH_URIS:localhost:9201}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  connection-timeout: 5000
  socket-timeout: 60000

# Neo4j
neo4j:
  enabled: ${NEO4J_ENABLED:false}
  uri: ${NEO4J_URI:bolt://localhost:7687}
  authentication:
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:neo4j123456}
  max-connection-pool-size: 5
  connection-acquisition-timeout: 5

# ──────────────────────────────────────────────────────────────
#  LLM（OpenAI 兼容协议）—— 智谱 GLM
#  实测：glm-4.5-air / glm-4.6v 均可用；两者默认开启思维链（reasoning_content），
#  简单对话下 thinking 会白烧 token（实测同题 60 → 2 completion tokens），
#  故默认关闭，需要多步推理时可在 yml 打开。
# ──────────────────────────────────────────────────────────────
openai:
  base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:glm-4.5-air}
  max-tokens: ${OPENAI_MAX_TOKENS:4096}
  temperature: ${OPENAI_TEMPERATURE:0.7}
  timeout: ${OPENAI_TIMEOUT:120}
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:30}
  # disabled / enabled / auto(不传该字段)
  thinking: ${OPENAI_THINKING:disabled}

# ──────────────────────────────────────────────────────────────
#  Embedding
#  注意：智谱赠送资源包不含 embedding（调用返回 code=1113 余额不足），
#  因此 embedding 单独走阿里云百炼 DashScope text-embedding-v3。
#  dimensions 必须与 Milvus collection 向量维度一致，修改后需重建 collection。
#  provider: remote（仅远程）/ local（仅本地哈希降级）/ auto（远程失败自动降级）
# ──────────────────────────────────────────────────────────────
embedding:
  provider: ${EMBEDDING_PROVIDER:auto}
  base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:text-embedding-v3}
  dimensions: ${EMBEDDING_DIMENSIONS:1024}

# ──────────────────────────────────────────────────────────────
#  鉴权（JWT）
# ──────────────────────────────────────────────────────────────
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  security:
    # 生产环境务必通过环境变量覆盖
    jwt-secret: ${JWT_SECRET:agi-assistant-dev-secret-please-change-in-production-0123456789}
    jwt-expire-hours: ${JWT_EXPIRE_HOURS:168}
    # 是否强制校验登录。false 时兼容旧的 X-User-Id 头（便于本地调试）
    auth-enabled: ${AUTH_ENABLED:true}
  memory:
    # 记忆衰减定时任务：每天凌晨 3 点对长期记忆做 importance 衰减
    decay-cron: ${MEMORY_DECAY_CRON:0 0 3 * * ?}
    decay-enabled: ${MEMORY_DECAY_ENABLED:true}
  chat:
    # 是否自动把 LLM 回答里的代码块丢进沙箱执行（有资源与安全成本，默认关）
    auto-execute-code-blocks: ${CHAT_AUTO_EXECUTE_CODE:false}
    # 触发 ReAct 多步推理的最小消息长度
    react-min-length: ${CHAT_REACT_MIN_LENGTH:300}
  sandbox:
    # 沙箱执行总开关。关闭时 /api/sandbox 直接返回未启用
    enabled: ${SANDBOX_ENABLED:true}
    # 是否要求显式确认后执行（true 时需请求带 confirm=true）
    require-confirm: ${SANDBOX_REQUIRE_CONFIRM:false}

# ──────────────────────────────────────────────────────────────
#  Harness 运行时（超时/重试/降级/状态机）
#  线程池必须有界：无界池在过载时会把线程数堆到 OOM，而不是可观测地拒绝
# ──────────────────────────────────────────────────────────────
harness:
  retry:
    max-retries: ${HARNESS_MAX_RETRIES:3}
    retry-delay: ${HARNESS_RETRY_DELAY:1000}
    backoff-multiplier: ${HARNESS_BACKOFF:2.0}
  timeout:
    llm-timeout: ${HARNESS_LLM_TIMEOUT:30000}
    tool-timeout: ${HARNESS_TOOL_TIMEOUT:10000}
    rag-timeout: ${HARNESS_RAG_TIMEOUT:10000}
  pool:
    core-size: ${HARNESS_POOL_CORE:8}
    max-size: ${HARNESS_POOL_MAX:32}
    queue-capacity: ${HARNESS_POOL_QUEUE:128}
    keep-alive-seconds: ${HARNESS_POOL_KEEPALIVE:60}

# Sandbox Docker Configuration
sandbox:
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    image-python: ${SANDBOX_PYTHON_IMAGE:python:3.11-slim}
    image-node: ${SANDBOX_NODE_IMAGE:node:20-slim}
    image-java: ${SANDBOX_JAVA_IMAGE:eclipse-temurin:17-jdk}
    timeout-seconds: ${SANDBOX_TIMEOUT:60}
    memory-limit: ${SANDBOX_MEMORY:512m}
    cpu-limit: ${SANDBOX_CPU:1.0}
    network-disabled: ${SANDBOX_NETWORK_DISABLED:true}
    read-only-root-fs: ${SANDBOX_READONLY_FS:true}
    tmpfs-size: ${SANDBOX_TMPFS:256m}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
  group-configs:
    - group: default
      display-name: AGI Assistant API
      paths-to-match: /api/**

# Logging
logging:
  level:
    io.milvus.client.AbstractMilvusGrpcClient: WARN
